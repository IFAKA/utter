[project]
name = "sbhost"
version = "0.1.0"
description = "SilentBand host: streaming, DSP, ML, simulator, recording, setup wizard"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "rich>=13",
  "pyserial>=3.5",
  "zeroconf>=0.130",
  "matplotlib>=3.11.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sb = "sbhost.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sbhost"]
