[project]
name = "utter"
version = "0.1.0"
description = "Utter host: streaming, DSP, ML, simulator, recording, setup wizard"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "rich>=13",
  "pyserial>=3.5",
  "zeroconf>=0.130",
  "matplotlib>=3.11.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
lm = [
    "pyarrow>=26.0.0",
    "torch>=2.14.1",
]

[project.scripts]
utter = "utter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utter"]
